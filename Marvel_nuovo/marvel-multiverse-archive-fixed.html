<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marvel: The Multiverse Archive</title>
<style>
:root{
  --bg:#090e17; --bg2:#131c29; --panel:rgba(236,29,36,0.06);
  --border:rgba(236,29,36,0.25); --text:#ffffff; --text-dim:#aeb4bd;
  --accent:#EC1D24; --accent-glow:rgba(236,29,36,0.5);
  --gold:#f4c518; --radius:16px;
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#f3f1ec;--bg2:#e9e6df;--panel:rgba(236,29,36,0.08);--border:rgba(236,29,36,0.25);--text:#171512;--text-dim:#5c584f;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:radial-gradient(ellipse 1200px 700px at 50% -10%,rgba(236,29,36,0.18),transparent 60%),radial-gradient(ellipse 900px 600px at 100% 20%,rgba(32,36,40,0.4),transparent 55%),var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;min-height:100%;overflow-x:hidden;transition:background .3s,color .3s;}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),#ffffff,var(--accent));z-index:60;box-shadow:0 0 10px var(--accent);}
h1,h2,h3,.wordmark,button,input{font-family:'Helvetica Neue',Arial,sans-serif;}
::-webkit-scrollbar{height:8px;width:8px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(9,14,23,0.85);border-bottom:1px solid var(--border);padding:env(safe-area-inset-top,0px) 0 0;}
:root[data-theme="light"] header{background:rgba(243,241,236,0.85);}
.navwrap{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px;}
.wordmark{font-weight:900;letter-spacing:-1px;font-size:1.15rem;color:var(--text);white-space:nowrap;cursor:pointer;text-transform:uppercase;}
.wordmark span{background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:800;letter-spacing:0;}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
nav button{background:none;border:none;color:var(--text-dim);font-size:0.85rem;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:0.5px;}
nav button:hover,nav button.active{color:#fff;background:var(--accent);}
.searchbox{position:relative;}
.searchbox input{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:20px;font-size:0.85rem;width:170px;transition:all .3s;}
.searchbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow);width:230px;}
.iconbtn{background:var(--bg2);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:0.95rem;transition:all .2s;}
.iconbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.1);}

.hero{position:relative;padding:120px 24px 100px;text-align:center;overflow:hidden;}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,var(--accent-glow),transparent 60%);opacity:.5;pointer-events:none;}
.hero h1{font-size:clamp(2.8rem,8vw,5.5rem);font-weight:900;letter-spacing:-2px;line-height:.95;position:relative;text-transform:uppercase;}
.hero h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 20px var(--accent-glow);}
.hero p{color:var(--text-dim);font-size:1.1rem;margin:20px auto 34px;max-width:500px;font-weight:500;}
.cta{background:var(--accent);color:#fff;border:none;padding:16px 36px;font-size:1rem;font-weight:800;border-radius:30px;cursor:pointer;box-shadow:0 8px 30px var(--accent-glow);transition:all .3s;text-transform:uppercase;letter-spacing:1px;}
.cta:hover{transform:translateY(-3px);box-shadow:0 12px 40px var(--accent-glow);}
.progressbar{max-width:420px;margin:44px auto 0;}
.progressbar .track{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;border:1px solid var(--border);}
.progressbar .fill{height:100%;background:linear-gradient(90deg,var(--accent),#ff4d4d);transition:width .5s;box-shadow:0 0 10px var(--accent);}
.progressbar .label{font-size:0.8rem;color:var(--text-dim);margin-top:10px;display:flex;justify-content:space-between;font-weight:600;}

main{max-width:1280px;margin:0 auto;padding:10px 24px 100px;}
section{margin:70px 0;}
.sectitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.sectitle h2{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;text-transform:uppercase;color:var(--text);}
.sectitle a{color:var(--accent);font-size:0.85rem;cursor:pointer;font-weight:700;text-decoration:none;transition:.2s;}
.sectitle a:hover{text-shadow:0 0 8px var(--accent-glow);}

.chiprow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.chip{border:1px solid var(--border);background:var(--bg2);color:var(--text-dim);padding:8px 18px;border-radius:20px;font-size:0.85rem;font-weight:600;cursor:pointer;transition:all .2s;}
.chip:hover{border-color:var(--accent);color:var(--text);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 15px var(--accent-glow);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;}
.card{border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);overflow:hidden;cursor:pointer;position:relative;transition:all .3s;}
.card:hover{transform:translateY(-6px);border-color:var(--c1,var(--accent));box-shadow:0 12px 30px rgba(0,0,0,0.4);}
.card .poster{height:360px;display:flex;align-items:flex-end;justify-content:center;position:relative;background:linear-gradient(135deg,var(--c1,#333),var(--c2,#111));overflow:hidden;}
.card .poster-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;}
.card .poster::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg2) 0%,rgba(0,0,0,0.1) 35%,transparent 60%);}
.card .poster-title{position:absolute;z-index:2;bottom:16px;left:0;right:0;font-size:1.4rem;font-weight:900;text-align:center;padding:10px 16px;line-height:1.1;text-shadow:0 4px 15px rgba(0,0,0,1),0 2px 6px rgba(0,0,0,0.9);color:#fff;text-transform:uppercase;}
.card .poster .watched-badge{position:absolute;top:12px;right:12px;background:var(--c1,var(--accent));color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:bold;z-index:3;box-shadow:0 2px 12px rgba(0,0,0,0.7);}
.card .body{padding:16px;position:relative;z-index:3;background:var(--bg2);border-top:3px solid var(--c1,var(--accent));}
.card .body .u{font-size:0.7rem;color:var(--c1,var(--accent));font-weight:800;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
.card .body h3{font-size:1.05rem;line-height:1.2;font-weight:800;margin-bottom:8px;}
.card .body .meta{font-size:0.8rem;color:var(--text-dim);font-weight:500;}
.poster-credit{font-size:0.65rem;line-height:1.35;margin-top:8px;color:var(--text-dim);}
.poster-credit a{color:inherit;text-decoration:underline;text-underline-offset:2px;}

.tlwrap{overflow-x:auto;padding:20px 0 40px;position:relative;}
.tltrack{display:flex;gap:0;min-width:max-content;position:relative;padding:0 20px;}
.tltrack::before{content:"";position:absolute;left:0;right:0;top:86px;height:4px;background:linear-gradient(90deg,transparent,var(--accent) 4%,var(--accent) 96%,transparent);box-shadow:0 0 10px var(--accent-glow);}
.tlnode{width:220px;flex:0 0 auto;position:relative;text-align:left;}
.tlnode .dot{width:18px;height:18px;border-radius:50%;background:var(--c1,var(--accent));margin:78px 0 18px 8px;border:3px solid var(--bg);box-shadow:0 0 14px var(--c1,var(--accent-glow));position:relative;z-index:2;}
.tlnode .year{font-size:0.8rem;font-weight:700;color:var(--text);position:absolute;top:50px;background:var(--bg2);padding:2px 8px;border-radius:10px;border:1px solid var(--border);}
.tlnode .card2{border:1px solid var(--border);background:var(--bg2);border-radius:12px;padding:14px;cursor:pointer;margin-right:20px;transition:all .2s;position:relative;overflow:hidden;}
.tlnode .card2::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c1,var(--accent));}
.tlnode .card2:hover{transform:translateY(-4px);border-color:var(--c1,var(--accent));box-shadow:0 8px 20px rgba(0,0,0,0.3);}
.tlnode .card2 h4{font-size:0.95rem;font-weight:800;line-height:1.2;margin-bottom:6px;}
.tlnode .card2 .p{font-size:0.75rem;color:var(--text-dim);font-weight:500;}
.tlgroup-label{font-size:0.9rem;font-weight:800;color:var(--accent);width:100%;margin:40px 0 10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px;}

.universe-band{display:flex;align-items:center;gap:18px;padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);margin-bottom:16px;cursor:pointer;transition:all .3s;}
.universe-band:hover{border-color:var(--accent);transform:translateX(6px);box-shadow:0 10px 25px rgba(0,0,0,0.2);}
.universe-band .sw{width:12px;height:50px;border-radius:6px;background:var(--c1,var(--accent));}
.universe-band h4{font-size:1.2rem;font-weight:800;}
.universe-band p{font-size:0.9rem;color:var(--text-dim);margin-top:4px;}
.universe-band .count{margin-left:auto;font-size:0.85rem;font-weight:700;color:var(--accent);background:var(--panel);padding:6px 12px;border-radius:20px;}

footer{border-top:1px solid var(--border);padding:40px 24px;text-align:center;color:var(--text-dim);font-size:0.85rem;font-weight:500;}

.overlay{position:fixed;inset:0;background:rgba(9,14,23,0.85);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.open{opacity:1;pointer-events:auto;}
.modal{background:var(--bg2);width:100%;max-width:800px;max-height:90vh;overflow-y:auto;border-radius:24px;border:1px solid var(--border);transform:scale(.95) translateY(20px);transition:all .3s;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.overlay.open .modal{transform:scale(1) translateY(0);}
.modal .mhead{min-height:320px;background:linear-gradient(135deg,var(--c1,#333),var(--c2,#111));position:relative;display:flex;align-items:center;gap:28px;padding:24px 30px;background-size:cover;background-position:center 20%;}
.modal .mhead::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,var(--bg2) 0%,transparent 80%);}
.modal .mhead .cover{position:relative;z-index:2;width:184px;height:276px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));}
.modal .mhead .x{position:absolute;left:20px;top:20px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem;z-index:10;transition:.2s;}
.modal .mhead .x:hover{background:var(--accent);transform:rotate(90deg);}
.modal .mhead .info{position:relative;z-index:10;}
.modal .mhead .u{color:var(--text);font-size:0.85rem;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;background:var(--c1,var(--accent));display:inline-block;padding:4px 10px;border-radius:6px;}
.modal .mhead h2{color:#fff;font-size:2.2rem;font-weight:900;line-height:1.1;text-shadow:0 4px 15px rgba(0,0,0,0.8);}
.modal .mhead .poster-credit{color:rgba(255,255,255,.85);max-width:360px;}
.modal .mbody{padding:30px;}
.modal .row{display:flex;flex-wrap:wrap;gap:12px 24px;font-size:0.9rem;color:var(--text-dim);margin-bottom:24px;background:rgba(0,0,0,0.2);padding:16px;border-radius:12px;}
.modal .row b{color:var(--text);}
.modal .actions{display:flex;gap:14px;margin-bottom:30px;flex-wrap:wrap;}
.modal .actions button, .modal .actions a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--c1,var(--accent));background:transparent;color:var(--text);padding:12px 24px;border-radius:30px;font-size:0.95rem;font-weight:800;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.modal .actions button:hover, .modal .actions a:hover{background:var(--c1,var(--accent));color:#fff;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
.modal .actions button.on{background:var(--c1,var(--accent));color:#fff;}
.modal h4{font-size:1.1rem;font-weight:800;margin:30px 0 12px;color:var(--c1,var(--accent));text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:6px;}
.modal p.txt{font-size:1.05rem;line-height:1.6;color:var(--text);}
.spoiler-box{background:rgba(255,255,255,0.03);border:1px dashed var(--c1,var(--accent));border-radius:12px;padding:20px;font-size:1rem;line-height:1.6;margin-top:10px;}
.spoiler-blur{filter:blur(8px);user-select:none;transition:filter .3s;}
.taglist{display:flex;flex-wrap:wrap;gap:10px;}
.tag{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-left:3px solid var(--c1,var(--accent));border-radius:8px;padding:8px 14px;font-size:0.85rem;font-weight:600;}
.linklist{display:flex;flex-direction:column;gap:10px;}
.linklist a{font-size:1rem;color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:8px;}
.linklist a::before{content:'→';color:var(--c1,var(--accent));}
.linklist a:hover{color:var(--c1,var(--accent));}
@media(max-width:600px){.navwrap{flex-wrap:wrap;}nav{order:3;width:100%;}.modal .mhead{min-height:220px;gap:16px;padding:18px;}.modal .mhead .cover{width:112px;height:168px;}.modal .mhead h2{font-size:1.35rem;}.modal .mbody{padding:20px;}}
</style>
</head>

  <div class="navwrap">

let state={watched:JSON.parse(localStorage.getItem('mva_watched')||'[]'),spoiler:false,view:'home',theme:localStorage.getItem('mva_theme')||'dark',filterU:'all',q:''};
document.documentElement.setAttribute('data-theme',state.theme);
function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('mva_theme',state.theme);document.documentElement.setAttribute('data-theme',state.theme);}
function toggleGlobalSpoiler(){state.spoiler=!state.spoiler;document.getElementById('spoilerBtn').textContent=state.spoiler?'👁️':'🙈';document.querySelectorAll('.spoiler-blur').forEach(e=>e.style.filter=state.spoiler?'none':'blur(6px)');}
function toggleWatched(id){const i=state.watched.indexOf(id);if(i>-1)state.watched.splice(i,1);else state.watched.push(id);localStorage.setItem('mva_watched',JSON.stringify(state.watched));render();if(document.getElementById('overlay').classList.contains('open'))openTitle(id);}
function pct(){return Math.round(state.watched.length/DATA.length*100);}
function totalMinutes(){return DATA.filter(d=>state.watched.includes(d.id)).reduce((a,d)=>a+(typeof d.runtime==='number'?d.runtime:0),0);}

function go(v,arg){state.view=v;state.arg=arg;render();window.scrollTo({top:0,behavior:'smooth'});}
function onSearch(v){state.q=v.toLowerCase();if(v)state.view='movies';render();}

function posterCreditMarkup(d){return d.posterCredit?`<div class="poster-credit">${d.posterCredit}</div>`:'';}

function card(d){
  const imageAlt = d.posterCredit ? `Immagine di riferimento: ${d.title}` : `Locandina di ${d.title}`;
  const posterImage = d.poster ? `<img class="poster-image" src="${d.poster}" alt="${imageAlt}" loading="lazy" onerror="this.nextElementSibling.hidden=false;this.remove()">` : '';
  const titleFallback = `<div class="poster-title" ${d.poster?'hidden':''}>${d.title}</div>`;
  return `<div class="card" style="--c1:${d.c1};--c2:${d.c2}" onclick="openTitle('${d.id}')">
    <div class="poster">${posterImage}${titleFallback}${state.watched.includes(d.id)?'<span class="watched-badge">✓</span>':''}</div>
    <div class="body"><div class="u">${d.universeLabel}</div><h3>${d.title}</h3><div class="meta">${d.year} · ${d.type}${d.phase!=='—'?' · '+d.phase:''}</div>${posterCreditMarkup(d)}</div>
  </div>`;
}

function startEndByUniverse(){
  return UNIVERSES.map(u=>{
    const items=DATA.filter(d=>d.universe===u.id).sort((a,b)=>a.chrono-b.chrono||a.year-b.year);
    return {u,start:items[0],end:items[items.length-1],count:items.length};
  }).filter(x=>x.start);
}

function renderWhereToStart(){
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${startEndByUniverse().map(x=>`
    <div class="card" style="--c1:${x.start.c1};--c2:${x.end.c2};cursor:default;">
      <div class="poster" style="height:70px;"><span class="ic" style="font-size:1.6rem">${x.u.icon}</span></div>
      <div class="body">
        <div class="u">${x.u.label} · ${x.count} titoli</div>
        <div style="font-size:0.8rem;margin:6px 0 3px;"><b>Inizia con:</b> <a style="color:var(--text);cursor:pointer;text-decoration:underline;" onclick="openTitle('${x.start.id}')">${x.start.title}</a></div>
        <div style="font-size:0.8rem;"><b>Finisce con:</b> <a style="color:var(--text);cursor:pointer;text-decoration:underline;" onclick="openTitle('${x.end.id}')">${x.end.title}</a></div>
      </div>
    </div>`).join('')}</div>`;
}

function renderHome(){
  const latest=[...DATA].sort((a,b)=>b.year-a.year).slice(0,4);
  const mcuOrdered=DATA.filter(d=>d.universe==='mcu').sort((a,b)=>a.chrono-b.chrono||a.year-b.year);
  const cont=mcuOrdered.find(d=>!state.watched.includes(d.id))||DATA.find(d=>!state.watched.includes(d.id));
  const contPos=cont?mcuOrdered.findIndex(d=>d.id===cont.id)+1:0;
  return `
  <div class="hero">
    <h1>MARVEL<br><em>THE MULTIVERSE ARCHIVE</em></h1>
    <p>"Every universe. Every story."</p>
    <button class="cta" onclick="go('timeline')">INIZIA IL VIAGGIO</button>
    <div class="progressbar"><div class="track"><div class="fill" style="width:${pct()}%"></div></div>
    <div class="label"><span>${state.watched.length}/${DATA.length} titoli visti (${pct()}%)</span><span>${totalMinutes()} min guardati</span></div></div>
  </div>
  <main><section><div class="sectitle"><h2>Anteprima Timeline</h2><a onclick="go('timeline')">apri timeline →</a></div>${renderTimeline(true)}</section>
  <section><div class="sectitle"><h2>Da dove iniziare, dove finire</h2><a onclick="go('timeline')">vedi timeline completa →</a></div>
  <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:18px;max-width:600px;">Ogni universo ha un punto di ingresso e un punto di chiusura consigliati, in base all’ordine cronologico interno.</p>
  ${renderWhereToStart()}</section>
  <section><div class="sectitle"><h2>Universi</h2><a onclick="go('universes')">esplora tutti →</a></div>${renderUniversesList()}</section>
  <section><div class="sectitle"><h2>Ultime uscite</h2></div><div class="grid">${latest.map(card).join('')}</div></section>
  <section><div class="sectitle"><h2>A che punto sei</h2></div>${cont?`<p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:14px;">${cont.universe==='mcu'?`Sei al titolo <b style="color:var(--text)">${contPos}</b> di <b style="color:var(--text)">${mcuOrdered.length}</b> nella cronologia MCU.`:'Prossimo titolo consigliato dall’archivio:'}</p><div class="grid">${card(cont)}</div>`:'<p class="empty">Hai visto tutto ciò che è nell’archivio 🎉</p>'}</section>
  </main>`;
}

function renderTimeline(preview){
  const mcu=DATA.filter(d=>d.universe==='mcu').sort((a,b)=>a.chrono-b.chrono||a.year-b.year);
  const others=DATA.filter(d=>d.universe!=='mcu');
  const byU={};others.forEach(d=>{(byU[d.universe]=byU[d.universe]||[]).push(d)});
  const mcuShown=preview?mcu.slice(0,10):mcu;
  let html=`<div class="chiprow"><span class="tlgroup-label" style="margin:0">Cronologia interna MCU (ordine degli eventi; l’anno mostrato è narrativo quando disponibile)</span></div>
  <div class="tlwrap"><div class="tltrack">${mcuShown.map((d,i)=>`
    <div class="tlnode" style="--c1:${d.c1}"><div class="dot"></div><span class="year">${d.eventYear||d.year}${i===0?' · INIZIA QUI':(!preview&&i===mcuShown.length-1?' · ULTIMO':'')}</span>
      <div class="card2" onclick="openTitle('${d.id}')"><h4>${d.title}</h4><div class="p">${d.phase} · ${d.type}${d.eventYear?` · Evento ${d.eventYear}`:''}</div></div>
    </div>`).join('')}</div></div>`;
  if(!preview){
    html+=`<h3 style="margin:36px 0 10px;font-size:1.1rem;font-family:'Helvetica Neue',Arial,sans-serif;">Universi paralleli</h3>
    <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:18px;max-width:560px;">Timeline indipendenti: ogni universo ha una propria continuity interna, separata dal MCU salvo dove esplicitamente collegato (vedi Multiverse Connections).</p>`;
    Object.keys(byU).forEach(u=>{
      const items=byU[u].sort((a,b)=>a.chrono-b.chrono);
      const meta=UNIVERSES.find(x=>x.id===u);
      html+=`<div class="tlgroup-label">${meta?meta.label:u}</div>
      <div class="tlwrap"><div class="tltrack">${items.map((d,i)=>`
        <div class="tlnode" style="--c1:${d.c1}"><div class="dot"></div><span class="year">${d.eventYear||d.year}${i===0?' · INIZIA QUI':(i===items.length-1?' · ULTIMO':'')}</span>
          <div class="card2" onclick="openTitle('${d.id}')"><h4>${d.title}</h4><div class="p">${d.type}${d.eventYear?` · Evento ${d.eventYear}`:''}</div></div>
        </div>`).join('')}</div></div>`;
    });
    html+=`<h3 style="margin:36px 0 10px;font-size:1.1rem;font-family:'Helvetica Neue',Arial,sans-serif;">Multiverse Connections</h3>
    <p style="color:var(--text-dim);font-size:0.85rem;line-height:1.7;max-width:640px;">
    • <b style="color:var(--text)">No Way Home</b> collega ufficialmente MCU, universo Raimi e universo Amazing Spider-Man tramite un incantesimo multiversale: sono universi distinti che si incontrano, non lo stesso universo.<br>
    • <b style="color:var(--text)">Deadpool &amp; Wolverine (2024)</b> integra formalmente l’intero universo Fox/X-Men nella cornice multiversale del MCU, tramite la TVA e il Vuoto.<br>
    • <b style="color:var(--text)">Venom: La Furia di Carnage</b> mostra un breve varco dimensionale verso l’MCU, ma resta un universo Sony a sé, senza legami diretti confermati altrove.<br>
    • <b style="color:var(--text)">Spider-Verse</b> è un multiverso narrativamente autonomo, animato, non intrecciato con quello live-action.</p>`;
  }
  return html;
}

function renderUniversesList(){
  return UNIVERSES.map(u=>{const n=DATA.filter(d=>d.universe===u.id).length;const sample=DATA.find(d=>d.universe===u.id);
    return `<div class="universe-band" style="--c1:${sample?sample.c1:'#888'}" onclick="go('movies','${u.id}')">
    <div class="sw"></div><div><h4>${u.icon} ${u.label}</h4><p>${u.desc}</p></div><div class="count">${n} titoli</div></div>`}).join('');
}

function renderMovies(){
  let list=DATA;
  if(state.filterU!=='all')list=list.filter(d=>d.universe===state.filterU);
  if(state.q)list=list.filter(d=>d.title.toLowerCase().includes(state.q)||d.originalTitle.toLowerCase().includes(state.q));
  const chips=['all',...UNIVERSES.map(u=>u.id)];
  return `<main><section style="margin-top:30px">
  <div class="sectitle"><h2>Database titoli (${DATA.length} totali)</h2></div>
  <div class="chiprow">${chips.map(c=>`<button class="chip ${state.filterU===c?'active':''}" onclick="setFilter('${c}')">${c==='all'?'Tutti':UNIVERSES.find(u=>u.id===c).label}</button>`).join('')}</div>
  ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<p class="empty">Nessun titolo trovato per questa ricerca.</p>'}
  </section></main>`;
}
function setFilter(c){state.filterU=c;render();}

function renderUniverses(){
  return `<main><section style="margin-top:30px"><div class="sectitle"><h2>Universi Marvel</h2></div>
  <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:22px;max-width:600px;">Marvel non è sinonimo di MCU: questi sono universi narrativamente distinti, ciascuno con la propria continuity.</p>
  ${renderUniversesList()}</section></main>`;
}

function renderTimelineView(){
  return `<main><section style="margin-top:30px"><div class="sectitle"><h2>Timeline del Multiverso</h2></div>${renderTimeline(false)}</section></main>`;
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.view));
  const app=document.getElementById('app');
  if(state.view==='home')app.innerHTML=renderHome();
  else if(state.view==='timeline')app.innerHTML=renderTimelineView();
  else if(state.view==='universes')app.innerHTML=renderUniverses();
  else if(state.view==='movies'){if(state.arg){state.filterU=state.arg;state.arg=null;}app.innerHTML=renderMovies();}
}
document.getElementById('nav').addEventListener('click',e=>{if(e.target.dataset.v)go(e.target.dataset.v);});

function getTrailerLink(title) {
    return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(title + ' trailer ita');
}

function openTitle(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  const isW=state.watched.includes(id);
  const imageAlt = d.posterCredit ? `Immagine di riferimento: ${d.title}` : `Locandina di ${d.title}`;
  // Usa la stessa sequenza cronologica della Timeline per costruire i collegamenti.
  // In questo modo "prima/dopo" resta sempre sincronizzato anche quando i dati vengono aggiornati.
  const timelineItems = DATA
    .filter(x => x.universe === d.universe)
    .map((x, index) => ({...x, _dataIndex:index}))
    .sort((a,b) => a.chrono - b.chrono || a.year - b.year || a._dataIndex - b._dataIndex);

  const currentIndex = timelineItems.findIndex(x => x.id === d.id);
  const previousItems = currentIndex > 0 ? [timelineItems[currentIndex - 1]] : [];
  const nextItems = currentIndex >= 0 && currentIndex < timelineItems.length - 1 ? [timelineItems[currentIndex + 1]] : [];

  const linkTitles=(arr, emptyText)=>arr.length
    ? `<div class="linklist">${arr.map(t=>`<a onclick="openTitle('${t.id}')">${t.title}<span style="font-size:.72rem;color:var(--text-dim);font-weight:500;margin-left:auto">${t.year}</span></a>`).join('')}</div>`
    : `<span style="color:var(--text-dim)">${emptyText}</span>`;
  
  const bg = d.poster ? `background-image:linear-gradient(rgba(9,14,23,0.48),rgba(9,14,23,0.78)),url('${d.poster}');` : '';
  
  document.getElementById('modal').innerHTML=`
  <div class="mhead" style="--c1:${d.c1};--c2:${d.c2}; ${bg}">
    <button class="x" onclick="closeModal()">✕</button>
    ${d.poster?`<img class="cover" src="${d.poster}" alt="${imageAlt}" onerror="this.remove()">`:''}
    <div class="info"><div class="u">${d.universeLabel}</div><h2>${d.title}</h2>${posterCreditMarkup(d)}</div>
  </div>
  <div class="mbody" style="--c1:${d.c1};--c2:${d.c2}">
    <div class="row">
      <span><b>Anno:</b> ${d.year}</span>
      <span><b>Uscita:</b> ${d.releaseDate}</span>
      <span><b>Tipo:</b> ${d.type}</span>
      ${d.runtime ? `<span><b>Durata:</b> ${d.runtime} min</span>` : ''}
      <span><b>Stato:</b> ${d.status || 'Uscito'}</span>
    </div>
    <div class="actions">
      <button class="${isW?'on':''}" onclick="toggleWatched('${d.id}')">${isW?'✓ Visto':'Segna come visto'}</button>
      <a href="${getTrailerLink(d.title)}" target="_blank" rel="noopener noreferrer">▶ Guarda Trailer su YouTube</a>
    </div>
    
    <h4>Trama (senza spoiler)</h4><p class="txt">${d.synopsis}</p>
    
    <h4>Trama dettagliata <button style="font-size:0.7rem;padding:4px 12px;border-radius:12px;border:1px solid var(--c1);background:transparent;color:var(--text);cursor:pointer;margin-left:10px;" onclick="toggleGlobalSpoiler()">${state.spoiler?'nascondi':'mostra'} spoiler</button></h4>
    <div class="spoiler-box" style="border-color:var(--c1)"><div class="spoiler-blur" style="filter:${state.spoiler?'none':'blur(8px)'}">${d.spoiler}</div></div>
    
    <h4>Personaggi</h4><div class="taglist">${d.characters.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    
    <h4>Antagonisti</h4><div class="taglist">${d.villains.map(c=>`<span class="tag">${c}</span>`).join('')}</div>
    
    <h4>Come si collega</h4><p class="txt" style="font-size:0.95rem;color:var(--text-dim)">${d.connections.join(' ')}</p>
    
    <div style="display:flex;gap:40px;margin-top:30px;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;"><h4>Da guardare prima</h4>${linkTitles(previousItems,'Nessun titolo precedente in questa timeline')}</div>
      <div style="flex:1;min-width:200px;"><h4>Da guardare dopo</h4>${linkTitles(nextItems,'Nessun titolo successivo in questa timeline')}</div>
    </div>
  </div>`;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

render();
</script>
</body>
</html>
